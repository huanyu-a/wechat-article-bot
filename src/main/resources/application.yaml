spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: wechat-article-bot
  datasource:
    url: ${ENV.MYSQL_URL:jdbc:mysql://100.73.43.10:3306/wechat-article?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${ENV.MYSQL_USERNAME:root}
    password: ${ENV.MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:db/quartz/schema-mysql.sql
    properties:
      org.quartz.scheduler.instanceName: WechatArticleScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.jobStore.useProperties: true
  mybatis:
    smart:
      enabled: true
      auto-sync-db: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8081}

app:
  schedule:
    # 单阶段智能体会话硬超时（秒）：SSE 流被掐断后 agent4j 可能永不完成 Future，任务会永久停在 RUNNING。
    # 1800 意味着每次事故都白等半小时且期间占着并发闸门（上游网关并发配额有限），故收紧到 300：
    # 正常的单阶段会话是分钟级，300s 足够；停滞则由 AgentInvoker 再重建会话重试一次。
    stage-timeout-seconds: ${STAGE_TIMEOUT_SECONDS:300}
    # 写作阶段的会话硬超时（秒）：PIPELINE 的 WRITING 与 COORDINATOR 的委托写作共用这一档
    # （见 StageTimeoutPolicy）。300 是照「单个阶段会话是分钟级」定的，对检索/配图/审核成立，
    # 对写作不成立——写作要一次生成 30k+ 字符的完整成稿，量级与 SINGLE（900s）相当。
    # 实测 run#14 / run#18：写作阶段都**恰好停在 300s**，且超时触发时「最后活动距今 0 秒」
    # （会话一直在正常出字，只是成稿没写完）——是误杀而不是止损。
    # 不直接把全局 stage-timeout-seconds 抬到 900：那个值同时是停滞止损速度与
    # StaleRunPolicy 的孤儿判定基准，抬它会让检索/配图/审核的卡死白等时间同步变长。
    writing-timeout-seconds: ${WRITING_TIMEOUT_SECONDS:900}
    # 协调者主编会话硬超时（秒，COORDINATOR 链路）：主编的一次会话**覆盖全部委托**，
    # 每次委托都是一次完整的子会话（还各带一次停滞重试），量级与单阶段会话完全不同。
    # 实测 run#41/42/47/48 的卡点都是「主编侧无事件、子智能体正在运行」——300s 一到就把正常工作中的
    # 主编硬超时杀掉、整轮 FAILED；编辑器的同类会话（含委托）本就按 1800s 计，这里对齐。
    coordinator-timeout-seconds: ${COORDINATOR_TIMEOUT_SECONDS:1800}
    # 单智能体会话硬超时（秒，SINGLE 链路）：**一次会话就要做完调研 + 写作 + 配图**，
    # 与「每个阶段各起一个会话」的 PIPELINE 不是同一个量级。此前 SINGLE 走的是全局
    # stage-timeout-seconds（300s，按「单个阶段」定的），实测结果是它从未成功跑过 300 秒：
    # 6 次成功运行最长 272s，12 次失败**全部**卡在 300s（含 09-13、09-14 两次真实定时触发），
    # 而同样三件事由 PIPELINE 分阶段做完的成功运行均值是 533~1194s。
    # 900 取自两者之间：覆盖正常工作量，同时仍给失控会话封顶（停滞会由 AgentInvoker 重试一次）。
    single-timeout-seconds: ${SINGLE_TIMEOUT_SECONDS:900}
    # 会话失败的重试策略（见 AgentInvoker）：只在**本次尝试零工具调用**时重试（无付费副作用），
    # 且「永久错误」（鉴权/审查/模型未配置/余额不足）一律不重试。
    retry:
      # 瞬时错误（429 并发超限、连接重置、5xx、流中断、零工具调用的空指针）的最大重试次数。
      # 由 3 提到 5：这些错误常在零工具调用时数秒内返回，重试成本远低于整轮重跑。
      transient-max: ${RETRY_TRANSIENT_MAX:5}
      # 退避间隔（毫秒，逗号分隔），长度不足时沿用最后一项；合计 31 秒。
      backoff-millis: ${RETRY_BACKOFF_MILLIS:1000,2000,4000,8000,16000}
      # 阶段停滞的重试次数：有意保持 1 次——每次停滞要白等一整个会话超时（SINGLE 下两次就是半小时），
      # 与秒级返回的模型报错代价差两个数量级，不该随 transient-max 一起放大。
      stall-max: ${RETRY_STALL_MAX:1}
      # 无进展检测阈值（秒）：距上次有效事件超过该秒数即判停滞，不必等满硬超时。
      # 硬超时只回答「总共等了多久」，不回答「上游还活着吗」——实测一次卡死要白等一整个超时
      # （SINGLE 900s / COORDINATOR 1800s），期间零事件。加上本检测后，卡死的会话在 180 秒内被判停滞，
      # 立刻走「换模型档案 / 重建会话」的重试路径。硬超时仍保留作为不依赖上报的兜底。
      # 「有工具正在执行」视为有进展：协调者主编委托子智能体时主编侧本就收不到事件，
      # 只按事件计时会把正常等待委托的主编误杀（实测 run#41/42/47/48）。0 或负数表示关闭本检测。
      inactivity-seconds: ${RETRY_INACTIVITY_SECONDS:180}
    # 工具调用预算（方案 5.5 预算护栏的可配置来源，见 ToolCallBudget）：
    # 调研阶段单独一档——实测 run#46 的调研子智能体 25 次调用全部成功（search_web ×20 + browse_webpage ×5，
    # 零失败零重试），仅因超过 24 的上限 1 次就让整轮 PIPELINE 失败。宽口径调研的正常工作量本就大于写作/审核；
    # run#62 进一步说明 40 仍不够：同一任务发起 47 次调用、前 40 次全部成功，故按实测上浮到 60。
    # stage 一档 24 → 36：修复后的 run#63 / run#68 逐会话计数显示配图 26 次、审核 25 次都已越过 24，
    # 只是靠「收尾工具宽限」才把成果交出来——宽限是兜底，不该是常态。
    # total 120 → 200：run#68 整轮实测 110 次，距 120 只剩 8 次。
    # 触顶不再等于白干：收尾工具（save_research_notes 等）在预算用尽后仍放行有限次，见 ToolCallBudget.TERMINAL_TOOLS。
    tool-calls:
      research: ${TOOL_CALLS_RESEARCH:60}
      stage: ${TOOL_CALLS_STAGE:36}
      chief: ${TOOL_CALLS_CHIEF:48}
      total: ${TOOL_CALLS_TOTAL:200}
      # SINGLE 链路（一次会话做完调研 + 写作 + 配图）：此前是 ArticleAiService 里的硬编码常量 40，
      # 也是唯一不受本节约束的预算——同一件事在 PIPELINE 里分三段跑有 60+36+36，
      # 挤在一次会话里反而只有 40。60 取自各段实测工作量（调研可达 47、配图约 26）。
      single: ${TOOL_CALLS_SINGLE:60}
    # 遗留运行判定阈值（小时）：进程被杀时 task_run 会永久停在 RUNNING 并占住并发闸门；
    # 启动时与下一次触发时中止「开始时间超过本阈值」的运行。COORDINATOR 一轮的上界是
    # 「主编超时 1800s + 子会话 300s × 委托数」≈ 1.2h，PIPELINE 是「阶段超时 300s × 阶段数上界 19
    # （4 基础阶段 + 5 轮返工 × 3）≈ 1.6h」；取 3h 是在两者之上留出余量——调小到低于这个估算值会把
    # 仍在正常执行的运行误判为孤儿（启动时会打 WARN 提醒）；Quartz 集群部署下多实例共用一套库，
    # 更不能设得过小。
    # ⚠️ 写作档（writing-timeout-seconds=900）抬高了 PIPELINE 的最坏路径：写作阶段在
    # 「4 基础阶段 + 5 轮返工 × 3」里各出现一次（初次 + 每次返工），故上界变为
    # 4×300 + 15×900 ≈ 1.85h（原先 19×300 ≈ 1.6h）。3h 仍有余量，**不需要同步调大**；
    # 但若将来继续抬高写作档或返工轮数，必须重算这一项。
    # 注意 StaleRunPolicy.worstCaseRunSeconds() 用的仍是 stage-timeout-seconds（不含写作档），
    # 因此它给出的是**保守下界**——那是「启动告警」的判据，偏保守只会少告警、不会误判孤儿。
    # SINGLE 不参与这个上界：它只有**一次会话**（single-timeout-seconds=900s = 0.25h），
    # 远低于上面两条，故引入 SINGLE 独立超时不需要调整本值。
    # （single-timeout-seconds 不在其中——`StaleRunReaper` 传给 thresholdTooSmall 的是 stage-timeout-seconds，
    # SINGLE 的单次会话不进入 MAX_STAGES_PER_RUN 的阶段循环。）
    stale-run-hours: ${STALE_RUN_HOURS:3}
    # 运行心跳超时（秒，I2）：执行线程每 progress-flush-seconds 秒刷新 task_run.HEARTBEAT_AT，
    # 心跳早于本值即判定属主实例已失联/崩溃，其它实例可中止该运行并把自愈窗口压到分钟级。
    # 默认 180 = 心跳间隔（15s）× 12：容忍数次数据库抖动，又远小于旧的时间阈值（3h）。
    heartbeat-timeout-seconds: ${HEARTBEAT_TIMEOUT_SECONDS:180}
    # 运行中进度与心跳的落库间隔（秒，I10）：周期把 MODE/EXECUTION_LOG/TOOL_CALL_COUNT 刷进 task_run，
    # 使 RUNNING 行不再是「MODE=NULL、日志空、计数 0」。调小会更实时但增加写库频率。
    progress-flush-seconds: ${PROGRESS_FLUSH_SECONDS:15}
  llm:
    # 在飞智能体运行闸门（见 common/InFlightGate）：上游网关并发配额硬上限为 6，本应用自己先守住 4，
    # 余量留给编辑器链路与手工触发。排队超过 acquire-timeout-seconds 即让该次运行明确失败（不静默卡住）。
    max-in-flight: ${LLM_MAX_IN_FLIGHT:4}
    acquire-timeout-seconds: ${LLM_ACQUIRE_TIMEOUT_SECONDS:60}
    # 跨实例名额租约 TTL（秒，I1）：心跳早于 TTL 的租约会被其它实例回收（属主实例已崩溃/失联）。
    # 必须显著大于心跳间隔（TTL/3）以容忍单次数据库抖动；调大会延长故障后名额归还的等待时间。
    lease-ttl-seconds: ${LLM_LEASE_TTL_SECONDS:120}
    # 编辑器交互式会话的硬超时（秒）：与 schedule.stage-timeout-seconds 分开——用户在场，等 300 秒太短，
    # 且编辑器单轮可含多次浏览器工具等待（每次最长 90 秒）。停滞的编辑器会话此前无任何护栏，会永久占住
    # 一个并发名额且 TASK_RUN 无记录（现场线程栈实测 79 分钟），超时后释放名额并向浏览器发 error 事件。
    editor-timeout-seconds: ${EDITOR_TIMEOUT_SECONDS:1800}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
  security:
    token-ttl-hours: ${TOKEN_TTL_HOURS:24}
    secret-key: ${APP_SECRET_KEY:wechat-article-bot-dev-key-change-in-production}
  storage:
    path: ${STORAGE_PATH:./data/uploads}
