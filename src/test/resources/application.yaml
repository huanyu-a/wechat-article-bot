spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${ENV.MYSQL_TEST_URL}
    username: ${ENV.MYSQL_USERNAME}
    password: ${ENV.MYSQL_PASSWORD}
  quartz:
    job-store-type: jdbc
    jdbc:
      # 由 MySqlTestDatabaseInitializer 在上下文创建前统一重建 Quartz 表：
      # 若这里再执行一次脚本，会在 Quartz Scheduler 启动期间对同一批表做 DDL，
      # 偶发 MySQL "Table definition has changed, please retry transaction"（任务创建接口 500）。
      initialize-schema: never
      schema: classpath:db/quartz/schema-mysql.sql
    properties:
      org.quartz.scheduler.instanceName: WechatArticleSchedulerTest
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.useProperties: true
  mybatis:
    smart:
      enabled: true
      auto-sync-db: true
app:
  bootstrap:
    admin-username: admin
    admin-password: Admin@123
  security:
    secret-key: test-secret-key
  storage:
    path: ./target/test-uploads
